name: CI

on:
  push:
    branches: [main, features/*]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  # No paths-ignore here: "Unit Tests" and "Integration Tests" are required
  # status checks on main, and a skipped workflow never reports, which would
  # leave docs-only pull requests blocked forever.
  pull_request:
    branches: [main]
  # The release workflow runs this suite on the tagged commit before it
  # publishes anything. Called this way, github.event_name is the caller's
  # (a tag push or workflow_dispatch) and github.ref is the tag, so the Docker
  # Hub job's main-branch push condition stays false.
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      # uv.lock is the single authority; requirements.txt (what both Docker
      # images install, with --require-hashes) is generated from it. Fail the
      # build if pyproject.toml, the lock, or requirements.txt disagree.
      - name: Check lock and requirements.txt are in sync
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-emit-project -o /tmp/requirements.check
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.check) \
            || { echo "requirements.txt drifted from uv.lock; run: uv export --frozen --no-dev --no-emit-project -o requirements.txt"; exit 1; }

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.txt

      - name: Run unit tests
        env:
          FLASK_ENV: testing
          PROXMOX_HOST: fake-host
          PROXMOX_PASSWORD: fake-password
        run: |
          python -m pytest tests/ --ignore=tests/integration -q --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # No `needs: unit-tests`: the two suites share nothing and run on separate
    # runners, so they run in parallel. Every gate (the required checks, the
    # Docker Hub job, release.yml's call of this workflow) waits for both.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Start test server
        run: |
          docker compose -f docker-compose.test.yml up -d --build
          # Wait for server to be ready
          for _ in $(seq 1 30); do
            if curl -s http://localhost:5099/auth/health > /dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/test_flows.py --base-url http://localhost:5099 -v --tb=short

      - name: Stop test server
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down

  docker-push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    # Opt-in: set repository variables PUBLISH_DOCKERHUB=true,
    # DOCKERHUB_USERNAME and IMAGE_NAME, plus the DOCKERHUB_TOKEN secret.
    # Production builds its image on the droplet, so nothing depends on this job.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PUBLISH_DOCKERHUB == 'true'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME || 'lab-playground' }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME || 'lab-playground' }}:main
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME || 'lab-playground' }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
