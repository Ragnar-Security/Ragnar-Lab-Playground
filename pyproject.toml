[project]
name = "automation"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# uv.lock is the single authority for what gets installed. requirements.txt is
# GENERATED from it (never hand-edit):
#   uv lock && uv export --frozen --no-dev --no-emit-project -o requirements.txt
# The Dockerfiles install that file with --require-hashes, and CI fails on drift.
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.0.5",
    # 2.0.1+ is required: 2.0.0 dropped verify_ssl for API-token auth, so token
    # requests skipped TLS verification whatever PROXMOX_VERIFY_SSL said.
    "proxmoxer==2.0.1",
    "requests==2.33.0",
    "python-dotenv==1.2.2",
    "PyYAML>=6.0.1",
    "pymysql==1.1.1",
    "cryptography==50.0.0",
    "werkzeug==3.1.9",
    # Production server. 23.0.0 is the latest 23.x release.
    "gunicorn==23.0.0",
    "pytest==9.0.3",
    "pytest-cov==4.1.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "apscheduler>=3.10.0",
    # Async I/O for the gunicorn worker (run_prod.py patches the stdlib first;
    # we rely on threading being patched so queue.Queue.get yields). The upper
    # bound caps a future major-version surprise in the monkey-patch surface.
    "gevent>=23.9.0,<26",
]

[tool.pytest.ini_options]
# utcnow() is deprecated and, in this app, wrong by design: columns are naive
# LOCAL time (CLAUDE.md). Fail the suite if it creeps back in.
filterwarnings = [
    "error:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning",
]
