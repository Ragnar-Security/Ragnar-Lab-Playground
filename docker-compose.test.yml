services:
  test-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5099:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:////app/data/test.db
      - SECRET_KEY=test-secret-key-for-integration
      - PROXMOX_HOST=fake-proxmox-host
      - PROXMOX_PASSWORD=fake-password
      - ADMIN_LOGIN_ID=admin
      - ADMIN_PASSWORD=testadmin123
      - ADMIN_USERS=admin
      - TEMPLATES_FILE=/app/templates.yaml
      # The integration suite signs in as this student. Only this file asks for
      # the account, so production never seeds it.
      - SEED_TEST_STUDENT=1
      # Long enough for the password policy: the reset-link test sets a new
      # password through a link and then restores this one the same way.
      - TEST_STUDENT_PASSWORD=student-pass-123
    volumes:
      - ./tests/fixtures/templates.yaml:/app/templates.yaml:ro
    command: >
      sh -c "mkdir -p /app/instance && python scripts/init_db.py && python -m flask run --host=0.0.0.0 --port=5000"
