<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ (site_brand_tag ~ ' ') if site_brand_tag else '' }}{{ site_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0f1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
        }
        .auth-container { max-width: 420px; width: 100%; }
        .card {
            border: 1px solid #2a2d3a;
            border-radius: 12px;
            background: #1c1f2e;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .card-header {
            background: #161822;
            border-bottom: 1px solid #2a2d3a;
            border-radius: 12px 12px 0 0 !important;
            padding: 24px;
            text-align: center;
        }
        .card-header h3 {
            color: #e8eaed;
            font-weight: 700;
            font-size: 1.4rem;
            margin: 0;
        }
        .card-header p {
            color: #8b8fa3;
            font-size: 0.85rem;
        }
        .card-header .course-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: #E21833;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }
        .card-body { background: #1c1f2e; padding: 2rem; border-radius: 0 0 12px 12px; }
        .form-label { color: #8b8fa3; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
        .form-control {
            background: #161822;
            border: 1px solid #2a2d3a;
            color: #e8eaed;
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background: #161822;
            border-color: #E21833;
            color: #e8eaed;
            box-shadow: 0 0 0 3px rgba(226,24,51,0.15);
        }
        .form-control::placeholder { color: #5a5e72; }
        .btn-primary {
            background: #E21833;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.15s ease;
        }
        .btn-primary:hover {
            background: #ff2a45;
            box-shadow: 0 0 20px rgba(226,24,51,0.3);
        }
        .register-link {
            color: #E21833;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link:hover {
            color: #ff2a45;
        }
        hr { border-color: #2a2d3a; }
        .alert { background: rgba(239,68,68,0.1); border: none; border-left: 4px solid rgba(239,68,68,0.6); color: #e8eaed; border-radius: 8px; }
        .alert-success { background: rgba(52,211,153,0.1); border-left-color: rgba(52,211,153,0.6); }
        .alert-warning { background: rgba(251,191,36,0.1); border-left-color: rgba(251,191,36,0.6); }
        .alert .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }
        .text-center p { color: #8b8fa3; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="card">
            <div class="card-header text-center">
                {% if site_brand_tag %}<span class="course-label">{{ site_brand_tag }}</span>{% endif %}
                <h3>{{ site_name }}</h3>
                <p class="mb-0 mt-1">Sign in to access your labs</p>
            </div>
            <div class="card-body p-4">
                <!-- Alert Messages -->
                <div id="alert-container"></div>

                <!-- Login Form -->
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="loginUsername" class="form-label">Login ID</label>
                        <input type="text" class="form-control form-control-lg" id="loginUsername" name="login_id" required
                               placeholder="Enter your login ID" autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label for="loginPassword" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" id="loginPassword" name="password" required
                               placeholder="Enter your password" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        Sign In
                    </button>
                </form>

                {% if self_service_password_reset %}
                <div class="text-center mt-3">
                    <a href="/reset-password" class="register-link">Forgot your password?</a>
                </div>
                {% else %}
                <div class="text-center mt-3">
                    <small class="text-muted">Forgot your password? Ask an administrator to reset it.</small>
                </div>
                {% endif %}

                <hr class="my-4">

                <div class="text-center">
                    <p class="mb-0">
                        Don't have an account?
                        <a href="/register" class="register-link">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Show alert message
        function showAlert(message, type = 'danger') {
            const alertContainer = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.role = 'alert';
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);

            // Auto-dismiss after 5 seconds
            setTimeout(() => {
                alert.classList.remove('show');
                setTimeout(() => alert.remove(), 150);
            }, 5000);
        }

        // Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            // Disable submit button
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    showAlert(data.error || 'Login failed', 'danger');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                }
            } catch (error) {
                showAlert('Connection error. Please try again.', 'danger');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        // Auto-focus on username field
        document.getElementById('loginUsername').focus();
    </script>
</body>
</html>
